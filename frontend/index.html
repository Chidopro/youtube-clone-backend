<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        var host = (location.hostname || '').toLowerCase();
        if (host.endsWith('.screenmerch.com') && host !== 'www.screenmerch.com') {
          document.documentElement.classList.add('creator-storefront');
          var sub = host.split('.')[0];
          if (sub) document.documentElement.setAttribute('data-storefront', sub);
          var preconnect = document.createElement('link');
          preconnect.rel = 'preconnect';
          preconnect.href = 'https://sojxbydpcdcdzfdtbypd.supabase.co';
          preconnect.crossOrigin = 'anonymous';
          document.head.appendChild(preconnect);
          try {
            var brandRaw = localStorage.getItem('sm_storefront_brand_' + host)
              || sessionStorage.getItem('sm_storefront_brand_' + host);
            var logoUrl = brandRaw && JSON.parse(brandRaw).custom_logo_url;
            if (logoUrl) {
              var preload = document.createElement('link');
              preload.rel = 'preload';
              preload.as = 'image';
              preload.setAttribute('fetchpriority', 'high');
              preload.href = logoUrl;
              document.head.appendChild(preload);
            }
          } catch (e) {}
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScreenMerch - Create Custom Merchandise from Video Content</title>
    <link rel="icon" href="/favicon.ico?v=3" sizes="any">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=3">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ffffff">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Orbitron:wght@400;700&family=Bebas+Neue&family=Creepster&family=Dela+Gothic+One&family=Long+Cang&family=Pacifico&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
