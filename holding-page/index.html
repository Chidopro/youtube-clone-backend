<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>ScreenMerch — Coming Soon</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f3f4f6;
        color: #171717;
      }

      main {
        width: min(560px, 100%);
        padding: 48px 32px;
        border: 1px solid #d0d7de;
        border-radius: 8px;
        background: #fff;
        text-align: center;
        box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(2rem, 8vw, 3.5rem);
        letter-spacing: -0.05em;
      }

      p {
        margin: 0;
        color: #52525b;
        font-size: 1.1rem;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ScreenMerch</h1>
      <p>We’re preparing for launch. Please check back soon.</p>
    </main>
  </body>
</html>
